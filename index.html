<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Sistem Informasi Anggaran - DISPANTPH Kaltim</title>

    <!-- Google Fonts: Outfit & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Bootstrap 5 & FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom Style System -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="portal-body">

    <!-- Background Orbs -->
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>
    <div class="bg-shape shape-3"></div>
    <div class="bg-pattern"></div>

    <!-- Portal Login Card -->
    <div class="portal-card">
        <div class="brand-badge">
            <i class="fa-solid fa-leaf"></i> DISPANTPH KALTIM
        </div>
        <div class="icon-hero-wrapper">
            <div class="icon-hero-bg"></div>
            <div class="icon-hero-inner">
                <i class="fa-solid fa-wheat-awn"></i>
            </div>
        </div>
        <h1 class="title">Sistem Informasi Anggaran</h1>

        <p class="subtitle">
            Dinas Pangan, Tanaman Pangan, dan Hortikultura <br>
            <strong>Provinsi Kalimantan Timur</strong>
        </p>

        <!-- Feature Pills Grid -->
        <div class="feature-grid">
            <div class="feature-pill" title="Tanaman Pangan">
                <i class="fa-solid fa-seedling"></i>
                <span>Tanaman Pangan</span>
            </div>

            <div class="feature-pill" title="Hortikultura">
                <i class="fa-solid fa-apple-whole"></i>
                <span>Hortikultura</span>
            </div>

            <div class="feature-pill" title="APBD & APBN">
                <i class="fa-solid fa-landmark"></i>
                <span>APBD & APBN</span>
            </div>

            <div class="feature-pill" title="Realisasi Pagu">
                <i class="fa-solid fa-chart-pie"></i>
                <span>Realisasi Pagu</span>
            </div>
        </div>

        <!-- Info Direct Access -->
        <div class="info-access-box">
            <i class="fa-solid fa-shield-halved text-success"></i>
            <span>Akses Publik Direct & Tanpa Login</span>
        </div>

        <!-- Action Button -->
        <a href="dashboard.html" style="text-decoration: none; display: block;">
            <button class="btn-enter">
                <span>Mulai</span>
                <i class="fa-solid fa-arrow-right-long"></i>
            </button>
        </a>

        <!-- Footer -->
        <div class="portal-footer">
            &copy; 2026 Dinas Pangan, Tanaman Pangan, dan Hortikultura<br>
            Provinsi Kalimantan Timur
        </div>
    </div>

</body>

</html>
