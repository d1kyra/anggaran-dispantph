<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Dashboard APBD & APBN - DISPANTPH Kaltim</title>

    <!-- Google Fonts: Outfit & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Bootstrap 5 & FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom Style System -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="dashboard-body">

    <!-- Top Navbar -->
    <nav class="navbar navbar-dark navbar-custom mb-3 mb-md-4">
        <div class="container px-3 px-md-4 d-flex align-items-center justify-content-between">
            <span class="navbar-brand mb-0 d-flex align-items-center">
                <div class="brand-badge-icon">
                    <i class="fa-solid fa-wheat-awn"></i>
                </div>
                <span>Sistem Informasi Anggaran DISPANTPH</span>
            </span>
            <a href="index.html" class="btn btn-exit d-inline-flex align-items-center gap-2">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
                <span>Keluar</span>
            </a>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container px-3 px-md-4 pb-5">

        <!-- Header Banner & Toggle -->
        <div
            class="header-banner d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-3">
            <div>
                <h3 class="page-title">Monitoring Anggaran 2022 - 2026</h3>
                <p class="page-subtitle">Dinas Pangan, Tanaman Pangan, dan Hortikultura Provinsi Kalimantan Timur</p>
            </div>

            <!-- APBD / APBN Switcher -->
            <div class="toggle-container">
                <button id="btnAPBD" class="btn btn-toggle-source active-apbd" onclick="showTabAPBD()">
                    <i class="fa-solid fa-building-columns me-1 me-md-2"></i> APBD
                </button>
                <button id="btnAPBN" class="btn btn-toggle-source inactive" onclick="showTabAPBN()">
                    <i class="fa-solid fa-landmark me-1 me-md-2"></i> APBN
                </button>
            </div>
        </div>

        <!-- Section Title & Filter -->
        <div
            class="d-flex flex-wrap justify-content-between align-items-center mb-3 px-1 gap-2 filter-container-mobile">
            <h5 class="fw-bold text-dark m-0" id="mainTitle" style="font-size: clamp(1rem, 3vw, 1.2rem);">
                <i class="fa-solid fa-list-check text-success me-2"></i> Daftar Unit Kerja / Kegiatan APBD
            </h5>

            <!-- APBN Year Filter Dropdown -->
            <div id="filterTahunAPBN" class="d-none align-items-center gap-2">
                <label class="fw-bold small text-secondary m-0">Tahun Anggaran:</label>
                <select id="tahunApbn" class="form-select form-select-sm filter-select w-auto"
                    onchange="renderTableAPBN()">
                    <option value="2026" selected>2026</option>
                    <option value="2025">2025</option>
                    <option value="2024">2024</option>
                    <option value="2023">2023</option>
                    <option value="2022">2022</option>
                </select>
            </div>
        </div>

        <!-- TAMPILAN 1: KARTU APBD -->
        <div class="row g-3 mb-4" id="menuContainer"></div>

        <!-- TAMPILAN 2: TABEL APBN DINAMIS -->
        <div id="apbnContainer" class="d-none mb-4">
            <div class="table-custom-wrapper">
                <table class="table table-bordered table-hover table-excel mb-0 small">
                    <thead id="apbnTableHead"></thead>
                    <tbody id="apbnTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- MODAL MATRIKS (KHUSUS APBD) -->
    <div class="modal fade" id="matrixModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered">
            <div class="modal-content shadow-lg">
                <div class="modal-header modal-header-custom py-3 px-3 px-md-4">
                    <h5 class="modal-title fw-bold" id="modalTitle" style="font-size: clamp(1rem, 3vw, 1.25rem);">
                        Matriks Multiyears</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body p-3 p-md-4">
                    <div class="table-responsive" style="-webkit-overflow-scrolling: touch;">
                        <table
                            class="table table-bordered table-striped align-middle mb-0 text-center modal-matrix-table">
                            <thead class="table-dark small text-uppercase">
                                <tr>
                                    <th style="width: 25%; min-width: 170px;">Komponen Anggaran</th>
                                    <th>2022</th>
                                    <th>2023</th>
                                    <th>2024</th>
                                    <th>2025</th>
                                    <th>2026 (s.d Juni)</th>
                                    <th class="bg-success text-white">Total Keseluruhan</th>
                                </tr>
                            </thead>
                            <tbody id="matrixTableBody" class="small"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="database.js?v=3"></script>
    <script src="database2.js?v=3"></script>

    <script>
        let currentModeTitle = "APBD";
        let currentDataSource = {};

        function showTabAPBD() {
            currentModeTitle = "APBD";
            document.getElementById('btnAPBD').className = "btn btn-toggle-source active-apbd";
            document.getElementById('btnAPBN').className = "btn btn-toggle-source inactive";

            document.getElementById('menuContainer').classList.remove('d-none');
            document.getElementById('apbnContainer').classList.add('d-none');
            document.getElementById('filterTahunAPBN').classList.add('d-none');
            document.getElementById('filterTahunAPBN').classList.remove('d-flex');
            document.getElementById('mainTitle').innerHTML = '<i class="fa-solid fa-list-check text-success me-2"></i> Daftar Unit Kerja / Kegiatan APBD';

            currentDataSource = typeof dataAPBD !== 'undefined' ? dataAPBD : {};
            renderMenuCards();
        }

        function showTabAPBN() {
            currentModeTitle = "APBN";
            document.getElementById('btnAPBD').className = "btn btn-toggle-source inactive";
            document.getElementById('btnAPBN').className = "btn btn-toggle-source active-apbn";

            document.getElementById('menuContainer').classList.add('d-none');
            document.getElementById('apbnContainer').classList.remove('d-none');
            document.getElementById('filterTahunAPBN').classList.remove('d-none');
            document.getElementById('filterTahunAPBN').classList.add('d-flex');
            document.getElementById('mainTitle').innerHTML = '<i class="fa-solid fa-table text-primary me-2"></i> Realisasi Anggaran APBN';

            renderTableAPBN();
        }

        function renderMenuCards() {
            const container = document.getElementById('menuContainer');
            container.innerHTML = '';

            Object.keys(currentDataSource).forEach(key => {
                const item = currentDataSource[key];
                const col = document.createElement('div');
                col.className = 'col-12 col-md-6 col-lg-4';

                col.innerHTML = `
            <div class="card card-menu h-100 p-3" onclick="openUnitMatrix('${key}')">
                <div class="d-flex flex-column justify-content-between h-100">
                    <div>
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="badge-code">Kode: ${key}</span>
                            <span class="badge bg-light text-dark border small">${currentModeTitle}</span>
                        </div>
                        <h6 class="unit-name mt-1 mb-2">${item.nama}</h6>
                    </div>
                    <div class="text-end mt-3">
                        <small class="text-success fw-bold">Lihat Matriks Multiyears <i class="fa-solid fa-arrow-right-long ms-1"></i></small>
                    </div>
                </div>
            </div>
        `;
                container.appendChild(col);
            });
        }

        function renderTableAPBN() {
            const tahunPilihan = document.getElementById('tahunApbn').value;
            const thead = document.getElementById('apbnTableHead');
            const tbody = document.getElementById('apbnTableBody');

            thead.innerHTML = '';
            tbody.innerHTML = '';

            if (typeof dataAPBN === 'undefined' || !dataAPBN[tahunPilihan]) {
                tbody.innerHTML = `<tr><td colspan="12" class="text-center py-4 text-muted fw-bold">Data Tahun ${tahunPilihan} belum tersedia.</td></tr>`;
                return;
            }

            const dataTahunIni = dataAPBN[tahunPilihan];

            if (tahunPilihan === "2026") {
                thead.innerHTML = `
            <tr>
                <th rowspan="2" style="width:45px;" class="text-center align-middle">NO</th>
                <th rowspan="2" class="text-center align-middle">KODE SATKER</th>
                <th rowspan="2" style="min-width: 180px;" class="text-center align-middle">NAMA KEGIATAN</th>
                <th rowspan="2" class="text-center align-middle">KEWENANGAN (DK/TP)</th>
                <th rowspan="2" class="text-center align-middle">PAGU AWAL</th>
                <th rowspan="2" class="text-center align-middle">PAGU REVISI</th>
                <th rowspan="2" class="text-center align-middle">PAGU TAHUNAN</th>
                <th colspan="2" class="text-center align-middle">REALISASI</th>
                <th rowspan="2" class="text-center align-middle">FISIK (%)</th>
                <th rowspan="2" class="text-center align-middle">SISA ANGGARAN</th>
            </tr>
            <tr>
                <th class="text-center align-middle">Rp</th>
                <th class="text-center align-middle">%</th>
            </tr>`;
            } else if (tahunPilihan === "2025") {
                thead.innerHTML = `
            <tr>
                <th rowspan="2" style="width:45px;" class="text-center align-middle">NO</th>
                <th rowspan="2" class="text-center align-middle">KODE SATKER</th>
                <th rowspan="2" style="min-width: 180px;" class="text-center align-middle">NAMA KEGIATAN</th>
                <th rowspan="2" class="text-center align-middle">KEWENANGAN (DK/TP)</th>
                <th rowspan="2" class="text-center align-middle">PAGU AWAL</th>
                <th rowspan="2" class="bg-secondary text-center align-middle">PAGU REVISI</th>
                <th rowspan="2" class="text-center align-middle">PAGU TAHUNAN</th>
                <th colspan="2" class="text-center align-middle">REALISASI</th>
                <th rowspan="2" class="text-center align-middle">FISIK (%)</th>
                <th rowspan="2" class="text-center align-middle">SISA ANGGARAN</th>
            </tr>
            <tr>
                <th class="text-center align-middle">Rp.</th>
                <th class="text-center align-middle">%</th>
            </tr>`;
            } else if (tahunPilihan === "2024") {
                thead.innerHTML = `
            <tr>
                <th rowspan="2" style="width:45px;" class="text-center align-middle">NO</th>
                <th rowspan="2" class="text-center align-middle">KODE SATKER</th>
                <th rowspan="2" style="min-width: 180px;" class="text-center align-middle">NAMA KEGIATAN</th>
                <th rowspan="2" class="text-center align-middle">KEWENANGAN (DK/TP)</th>
                <th rowspan="2" class="text-center align-middle">PAGU AWAL</th>
                <th rowspan="2" class="bg-secondary text-center align-middle">PAGU REVISI</th>
                <th rowspan="2" class="text-center align-middle">PAGU TAHUNAN</th>
                <th colspan="2" class="text-center align-middle">REALISASI S.D 31 DES</th>
                <th rowspan="2" class="text-center align-middle">FISIK (%)</th>
                <th rowspan="2" class="text-center align-middle">SISA ANGGARAN</th>
            </tr>
            <tr>
                <th class="text-center align-middle">Rp.</th>
                <th class="text-center align-middle">%</th>
            </tr>`;
            } else if (tahunPilihan === "2023") {
                thead.innerHTML = `
            <tr>
                <th rowspan="2" style="width:45px;" class="text-center align-middle">No</th>
                <th rowspan="2" class="text-center align-middle">Kode Satker</th>
                <th rowspan="2" style="min-width: 180px;" class="text-center align-middle">Nama Kegiatan</th>
                <th rowspan="2" class="text-center align-middle">DK/TP</th>
                <th rowspan="2" class="text-center align-middle">Pagu Awal</th>
                <th rowspan="2" class="text-center align-middle">Pagu Revisi</th>
                <th rowspan="2" class="text-center align-middle">Pagu Tahunan</th>
                <th colspan="2" class="text-center align-middle">Realisasi</th>
                <th rowspan="2" class="text-center align-middle">Fisik</th>
                <th rowspan="2" class="text-center align-middle">Sisa</th>
            </tr>
            <tr>
                <th class="text-center align-middle">Keuangan</th>
                <th class="text-center align-middle">%</th>
            </tr>`;
            } else if (tahunPilihan === "2022") {
                thead.innerHTML = `
            <tr>
                <th rowspan="2" style="width:45px;" class="text-center align-middle">No</th>
                <th rowspan="2" class="text-center align-middle">Kode Satker</th>
                <th rowspan="2" style="min-width: 180px;" class="text-center align-middle">Nama Kegiatan</th>
                <th rowspan="2" class="text-center align-middle">DK/TP</th>
                <th rowspan="2" class="text-center align-middle">Pagu Awal</th>
                <th rowspan="2" class="text-center align-middle">Pagu Revisi</th>
                <th rowspan="2" class="text-center align-middle">Pagu Tahunan</th>
                <th colspan="2" class="text-center align-middle">Realisasi</th>
                <th rowspan="2" class="text-center align-middle">FISIK (%)</th>
                <th rowspan="2" class="text-center align-middle">Sisa</th>
            </tr>
            <tr>
                <th class="text-center align-middle">Keuangan</th>
                <th class="text-center align-middle">%</th>
            </tr>`;
            }

            let sumDK = { paguDipa: 0, paguRev2024: 0, paguBlokir: 0, paguRevisi: 0, paguSetelahBlokir: 0, realisasiRp: 0, realisasiFisikWeighted: 0, paguFisikSum: 0, sisa: 0 };
            let sumTP = { paguDipa: 0, paguRev2024: 0, paguBlokir: 0, paguRevisi: 0, paguSetelahBlokir: 0, realisasiRp: 0, realisasiFisikWeighted: 0, paguFisikSum: 0, sisa: 0 };
            let sumDKTP = { paguDipa: 0, paguRev2024: 0, paguBlokir: 0, paguRevisi: 0, paguSetelahBlokir: 0, realisasiRp: 0, realisasiFisikWeighted: 0, paguFisikSum: 0, sisa: 0 };
            let sumBKP = { paguDipa: 0, paguRev2024: 0, paguBlokir: 0, paguRevisi: 0, paguSetelahBlokir: 0, realisasiRp: 0, realisasiFisikWeighted: 0, paguFisikSum: 0, sisa: 0 };
            let sumTotal = { paguDipa: 0, paguRev2024: 0, paguBlokir: 0, paguRevisi: 0, paguSetelahBlokir: 0, realisasiRp: 0, realisasiFisikWeighted: 0, paguFisikSum: 0, sisa: 0 };

            dataTahunIni.forEach((item, index) => {
                const tr = document.createElement('tr');

                const pDipa = item.paguDipa || 0;
                const pRev24 = item.paguRev2024 || 0;
                const pBlokir = item.paguBlokir || 0;
                const pRevisi = item.paguRevisi || 0;
                const pSetelahBlokir = item.paguSetelahBlokir || 0;
                const realRp = item.realisasiRp || 0;
                const realFisik = item.realisasiFisik;
                const sisa = item.sisaAnggaran || 0;

                let pAwal, pRevisiTampil, pTahunan;
                if (tahunPilihan === "2025") {
                    pAwal = pDipa; pRevisiTampil = pBlokir; pTahunan = pSetelahBlokir;
                } else if (tahunPilihan === "2024") {
                    pAwal = pDipa; pRevisiTampil = pRev24; pTahunan = pSetelahBlokir;
                } else {
                    pAwal = pDipa; pRevisiTampil = pRevisi; pTahunan = pSetelahBlokir;
                }

                let badgeKewenangan = item.kewenangan === "DK" ? "badge bg-primary px-2" : "badge bg-warning text-dark px-2";
                if (item.kewenangan === "BKP") badgeKewenangan = "badge bg-info text-dark px-2";

                tr.innerHTML = `
                <td class="text-center">${index + 1}</td>
                <td class="text-center text-muted">${item.kodeSatker || '-'}</td>
                <td class="fw-semibold">${item.namaKegiatan}</td>
                <td class="text-center"><span class="${badgeKewenangan}">${item.kewenangan || '-'}</span></td>
                <td class="text-end">${formatRupiah(pAwal)}</td>
                <td class="text-end fw-semibold" style="color: ${pRevisiTampil < 0 ? '#dc3545' : '#000000'};">${formatRupiah(pRevisiTampil)}</td>
                <td class="text-end text-primary">${formatRupiah(pTahunan)}</td>
                <td class="text-end text-success fw-semibold">${formatRupiah(realRp)}</td>
                <td class="text-center fw-bold">${formatPersen(item.realisasiPersen)}</td>
                <td class="text-center fw-bold">${realFisik !== undefined ? formatPersen(realFisik) : '-'}</td>
                <td class="text-end fw-bold text-danger">${formatRupiah(sisa)}</td>
            `;
                tbody.appendChild(tr);

                const pBagiFisik = pTahunan;
                const actualFisik = realFisik !== undefined ? realFisik : item.realisasiPersen;
                const weightFisik = actualFisik !== undefined ? actualFisik * pBagiFisik : 0;

                sumTotal.paguDipa += pDipa; sumTotal.paguRev2024 += pRev24; sumTotal.paguBlokir += pBlokir; sumTotal.paguRevisi += pRevisi; sumTotal.paguSetelahBlokir += pSetelahBlokir; sumTotal.realisasiRp += realRp; sumTotal.sisa += sisa; sumTotal.realisasiFisikWeighted += weightFisik; sumTotal.paguFisikSum += pBagiFisik;

                if (item.kewenangan === "DK") {
                    sumDK.paguDipa += pDipa; sumDK.paguRev2024 += pRev24; sumDK.paguBlokir += pBlokir; sumDK.paguRevisi += pRevisi; sumDK.paguSetelahBlokir += pSetelahBlokir; sumDK.realisasiRp += realRp; sumDK.sisa += sisa; sumDK.realisasiFisikWeighted += weightFisik; sumDK.paguFisikSum += pBagiFisik;
                    sumDKTP.paguDipa += pDipa; sumDKTP.paguRev2024 += pRev24; sumDKTP.paguBlokir += pBlokir; sumDKTP.paguRevisi += pRevisi; sumDKTP.paguSetelahBlokir += pSetelahBlokir; sumDKTP.realisasiRp += realRp; sumDKTP.sisa += sisa; sumDKTP.realisasiFisikWeighted += weightFisik; sumDKTP.paguFisikSum += pBagiFisik;
                } else if (item.kewenangan === "TP") {
                    sumTP.paguDipa += pDipa; sumTP.paguRev2024 += pRev24; sumTP.paguBlokir += pBlokir; sumTP.paguRevisi += pRevisi; sumTP.paguSetelahBlokir += pSetelahBlokir; sumTP.realisasiRp += realRp; sumTP.sisa += sisa; sumTP.realisasiFisikWeighted += weightFisik; sumTP.paguFisikSum += pBagiFisik;
                    sumDKTP.paguDipa += pDipa; sumDKTP.paguRev2024 += pRev24; sumDKTP.paguBlokir += pBlokir; sumDKTP.paguRevisi += pRevisi; sumDKTP.paguSetelahBlokir += pSetelahBlokir; sumDKTP.realisasiRp += realRp; sumDKTP.sisa += sisa; sumDKTP.realisasiFisikWeighted += weightFisik; sumDKTP.paguFisikSum += pBagiFisik;
                } else if (item.kewenangan === "BKP") {
                    sumBKP.paguDipa += pDipa; sumBKP.paguRev2024 += pRev24; sumBKP.paguBlokir += pBlokir; sumBKP.paguRevisi += pRevisi; sumBKP.paguSetelahBlokir += pSetelahBlokir; sumBKP.realisasiRp += realRp; sumBKP.sisa += sisa; sumBKP.realisasiFisikWeighted += weightFisik; sumBKP.paguFisikSum += pBagiFisik;
                }
            });

            function buatBarisTotal(label, data, classBaris) {
                const tr = document.createElement('tr');
                tr.className = `${classBaris} fw-bold align-middle`;
                const pct = data.paguSetelahBlokir > 0 ? (data.realisasiRp / data.paguSetelahBlokir) * 100 : 0;
                const pctFisik = data.paguFisikSum > 0 && data.realisasiFisikWeighted > 0 ? (data.realisasiFisikWeighted / data.paguFisikSum) : 0;

                let pAwalSum, pRevisiSum, pTahunanSum;
                if (tahunPilihan === "2025") {
                    pAwalSum = data.paguDipa; pRevisiSum = data.paguBlokir; pTahunanSum = data.paguSetelahBlokir;
                } else if (tahunPilihan === "2024") {
                    pAwalSum = data.paguDipa; pRevisiSum = data.paguRev2024; pTahunanSum = data.paguSetelahBlokir;
                } else {
                    pAwalSum = data.paguDipa; pRevisiSum = data.paguRevisi; pTahunanSum = data.paguSetelahBlokir;
                }

                const htmlExtraCols = `
                <td class="text-end">${formatRupiah(data.realisasiRp)}</td>
                <td class="text-center">${formatPersen(pct)}</td>
                <td class="text-center">${data.realisasiFisikWeighted > 0 || pctFisik > 0 ? formatPersen(pctFisik) : '-'}</td>
                <td class="text-end">${formatRupiah(data.sisa)}</td>`;

                tr.innerHTML = `
            <td colspan="4" class="text-end text-uppercase pe-3">${label}</td>
            <td class="text-end">${formatRupiah(pAwalSum)}</td>
            <td class="text-end">${formatRupiah(pRevisiSum)}</td>
            <td class="text-end">${formatRupiah(pTahunanSum)}</td>
            ${htmlExtraCols}
        `;
                return tr;
            }

            if (tahunPilihan === "2026" || tahunPilihan === "2025" || tahunPilihan === "2024") {
                tbody.appendChild(buatBarisTotal("SUB TOTAL DK", sumDK, "table-light text-secondary"));
                tbody.appendChild(buatBarisTotal("SUB TOTAL TP", sumTP, "table-light text-secondary"));
                tbody.appendChild(buatBarisTotal("TOTAL (DK + TP)", sumTotal, "table-primary text-dark border-primary fs-6"));
            } else if (tahunPilihan === "2023") {
                tbody.appendChild(buatBarisTotal("Jumlah DK", sumDK, "table-light text-secondary"));
                tbody.appendChild(buatBarisTotal("Jumlah TP", sumTP, "table-light text-secondary"));
                tbody.appendChild(buatBarisTotal("Jumlah DK+TP (Propinsi)", sumDKTP, "table-primary text-dark border-primary fs-6"));
            } else if (tahunPilihan === "2022") {
                tbody.appendChild(buatBarisTotal("Jumlah DK", sumDK, "table-light text-secondary"));
                tbody.appendChild(buatBarisTotal("Jumlah TP", sumTP, "table-light text-secondary"));
                tbody.appendChild(buatBarisTotal("Jumlah", sumDKTP, "table-secondary text-dark"));
                if (sumBKP.paguDipa > 0) {
                    tbody.appendChild(buatBarisTotal("Jumlah BKP", sumBKP, "table-light text-secondary"));
                }
                tbody.appendChild(buatBarisTotal("Total", sumTotal, "table-primary text-dark border-primary fs-6"));
            }
        }

        function openUnitMatrix(key) {
            if (currentModeTitle === "APBN") return;
            const unit = currentDataSource[key];
            if (!unit) return;

            document.getElementById('modalTitle').innerHTML = `<i class="fa fa-folder-open text-warning me-2"></i> Matriks [${currentModeTitle}] - ${unit.nama}`;
            const tbody = document.getElementById('matrixTableBody');
            tbody.innerHTML = '';

            const komponenList = [
                { label: 'Pagu Awal', field: 'paguAwal' },
                { label: 'Pagu Penambahan/Pengurangan', isPenambahanPengurangan: true, onlyTahun: ['2022', '2023', '2024', '2025'], customStyleAPBD: true },
                { label: 'Pagu Tahunan', field: 'paguApbd' },
                { label: 'Realisasi Keuangan (Rp)', field: 'realisasiKeuangan' },
                { label: 'Sisa Pagu Anggaran (Rp)', isSisaPagu: true },
                { label: 'Persentase Keuangan (%)', field: 'realisasiPersen', isPercent: true },
                { label: 'Realisasi Fisik (%)', field: 'realisasiFisik', isPercent: true }
            ];
            const tahunList = ['2022', '2023', '2024', '2025', '2026'];

            komponenList.forEach(komponen => {
                const tr = document.createElement('tr');
                const labelClass = komponen.isSisaPagu ? 'text-start fw-bold bg-warning bg-opacity-25' : 'text-start fw-semibold bg-light';
                const tdLabel = document.createElement('td');

                tdLabel.textContent = komponen.label;
                tdLabel.className = labelClass;
                tr.appendChild(tdLabel);

                let totalNilai = 0;
                let jumlahTahunData = 0;

                tahunList.forEach(tahun => {
                    const tdTahun = document.createElement('td');

                    if (komponen.onlyTahun && !komponen.onlyTahun.includes(tahun)) {
                        tdTahun.textContent = '-';
                        tdTahun.className = 'text-center text-muted';
                        tr.appendChild(tdTahun);
                        return;
                    }

                    let nilai = 0;

                    if (komponen.isSisaPagu) {
                        const pagu = (unit[tahun] && unit[tahun]['paguApbd']) ? unit[tahun]['paguApbd'] : 0;
                        const realisasi = (unit[tahun] && unit[tahun]['realisasiKeuangan']) ? unit[tahun]['realisasiKeuangan'] : 0;
                        nilai = pagu > 0 ? (pagu - realisasi) : 0;
                        tdTahun.className = nilai > 0 ? 'text-end fw-bold text-success' : (nilai < 0 ? 'text-end fw-bold text-danger' : 'text-end fw-bold text-dark');
                        tdTahun.textContent = formatRupiah(nilai);
                    } else if (komponen.isPenambahanPengurangan) {
                        const dataTahun = unit[tahun] || {};
                        if (dataTahun.paguEfisiensi !== undefined && dataTahun.paguEfisiensi !== 0) {
                            nilai = dataTahun.paguEfisiensi;
                        } else if (dataTahun.paguAnggaran !== undefined && dataTahun.paguAnggaran !== 0) {
                            nilai = dataTahun.paguAnggaran;
                        } else if (dataTahun.paguApbd !== undefined && dataTahun.paguAwal !== undefined && dataTahun.paguApbd !== dataTahun.paguAwal) {
                            nilai = dataTahun.paguApbd - dataTahun.paguAwal;
                        } else {
                            nilai = 0;
                        }
                        if (nilai === 0) {
                            tdTahun.textContent = '-';
                            tdTahun.className = 'text-center text-muted';
                        } else {
                            tdTahun.innerHTML = formatRupiahStyled(nilai);
                            tdTahun.className = 'text-end';
                        }
                    } else if (komponen.customStyleAPBD) {
                        nilai = (unit[tahun] && unit[tahun][komponen.field]) ? unit[tahun][komponen.field] : 0;
                        tdTahun.innerHTML = formatRupiahStyled(nilai);
                        tdTahun.className = 'text-end';
                    } else {
                        if (!unit[tahun] || unit[tahun][komponen.field] === undefined) {
                            tdTahun.textContent = '-';
                            tdTahun.className = 'text-center text-muted';
                            nilai = 0;
                        } else {
                            nilai = unit[tahun][komponen.field];
                            tdTahun.className = komponen.isPercent ? 'text-center fw-bold' : 'text-end';
                            tdTahun.textContent = komponen.isPercent ? formatPersen(nilai) : formatRupiah(nilai);
                        }
                    }

                    tr.appendChild(tdTahun);

                    totalNilai += nilai;
                    if (unit[tahun] && unit[tahun][komponen.field] !== undefined) jumlahTahunData++;
                });

                const tdTotal = document.createElement('td');
                if (komponen.customStyleAPBD) {
                    tdTotal.className = 'text-end fw-bold table-primary';
                    tdTotal.innerHTML = formatRupiahStyled(totalNilai);
                } else if (komponen.isSisaPagu) {
                    tdTotal.className = totalNilai > 0 ? 'text-end fw-bold table-primary text-success' : (totalNilai < 0 ? 'text-end fw-bold table-primary text-danger' : 'text-end fw-bold table-primary text-dark');
                    tdTotal.textContent = formatRupiah(totalNilai);
                } else {
                    tdTotal.className = 'text-end fw-bold table-primary text-dark';
                    if (komponen.isPercent) {
                        const rataRata = jumlahTahunData > 0 ? (totalNilai / jumlahTahunData) : 0;
                        tdTotal.textContent = formatPersen(rataRata);
                    } else {
                        tdTotal.textContent = formatRupiah(totalNilai);
                    }
                }
                tr.appendChild(tdTotal);
                tbody.appendChild(tr);
            });

            const matrixModal = new bootstrap.Modal(document.getElementById('matrixModal'));
            matrixModal.show();
        }

        function formatRupiah(angka) {
            if (angka === 0 || !angka) return 'Rp 0';
            const isNegative = angka < 0;
            const formatted = Math.abs(angka).toLocaleString('id-ID');
            return (isNegative ? 'Rp - ' : 'Rp ') + formatted;
        }

        function formatRupiahStyled(val) {
            if (!val || val === 0) return `<span>-</span>`;
            if (val < 0) {
                return `<span style="color: #dc3545; font-weight: 600;">Rp - ${Math.abs(val).toLocaleString("id-ID")}</span>`;
            } else {
                return `<span style="color: #000; font-weight: 600;">Rp ${val.toLocaleString("id-ID")}</span>`;
            }
        }

        function formatPersen(angka) {
            if (angka === 0 || !angka) return '0%';
            return angka.toLocaleString('id-ID', { minimumFractionDigits: 1, maximumFractionDigits: 2 }) + '%';
        }

        window.onload = function () {
            showTabAPBD();
        };
    </script>
</body>

</html>
